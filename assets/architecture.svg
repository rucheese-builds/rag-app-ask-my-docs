<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" width="100%" height="100%">
  <!-- Definitions for arrows and filters -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#818CF8" />
    </marker>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .node {
      fill: rgba(30, 41, 59, 0.8);
      stroke: #6366F1;
      stroke-width: 1.5px;
      rx: 8px;
    }
    .node-router {
      fill: rgba(124, 58, 237, 0.2);
      stroke: #8B5CF6;
      stroke-width: 2px;
    }
    .node-db {
      fill: rgba(16, 185, 129, 0.1);
      stroke: #10B981;
      stroke-width: 1.5px;
      rx: 20px;
    }
    .text-title {
      font-family: 'Plus Jakarta Sans', 'Inter', sans-serif;
      font-size: 14px;
      font-weight: 700;
      fill: #FFFFFF;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .text-subtitle {
      font-family: 'Inter', sans-serif;
      font-size: 11px;
      fill: #94A3B8;
      text-anchor: middle;
      dominant-baseline: middle;
    }
    .edge-line {
      stroke: #818CF8;
      stroke-width: 2;
      fill: none;
      marker-end: url(#arrow);
    }
    .edge-label {
      font-family: 'JetBrains Mono', monospace;
      font-size: 10px;
      fill: #A5B4FC;
      text-anchor: middle;
    }
    .section-title {
      font-family: 'Plus Jakarta Sans', sans-serif;
      font-size: 16px;
      font-weight: 800;
      fill: #A855F7;
      letter-spacing: 0.05em;
    }
  </style>

  <!-- Background Grid -->
  <rect width="900" height="700" fill="#0B0F19" />
  
  <!-- Column Titles -->
  <text x="220" y="35" class="section-title" text-anchor="middle">📦 DOCUMENT INGESTION PIPELINE</text>
  <text x="680" y="35" class="section-title" text-anchor="middle">⚡ RETRIEVAL &amp; GENERATION PIPELINE</text>

  <!-- INGESTION PIPELINE (LEFT COLUMN) -->
  
  <!-- Raw PDFs -->
  <g transform="translate(120, 60)">
    <rect width="200" height="50" class="node" />
    <text x="100" y="25" class="text-title">Raw PDFs in data/</text>
    <text x="100" y="38" class="text-subtitle">Research &amp; Earnings reports</text>
  </g>
  <path d="M 220 110 L 220 140" class="edge-line" />

  <!-- Namespace Router -->
  <g transform="translate(120, 140)">
    <rect width="200" height="50" class="node node-router" />
    <text x="100" y="25" class="text-title">Namespace Router</text>
    <text x="100" y="38" class="text-subtitle">Folder structure detection</text>
  </g>
  
  <!-- Router Outputs -->
  <path d="M 120 165 L 70 165 L 70 220" class="edge-line" />
  <text x="50" y="195" class="edge-label">research/</text>
  
  <path d="M 320 165 L 370 165 L 370 220" class="edge-line" />
  <text x="395" y="195" class="edge-label">earnings/</text>

  <!-- Research Namespace -->
  <g transform="translate(10, 220)">
    <rect width="130" height="45" class="node" />
    <text x="65" y="22" class="text-title">Research Papers</text>
  </g>
  
  <!-- Earnings Namespace -->
  <g transform="translate(300, 220)">
    <rect width="130" height="45" class="node" />
    <text x="65" y="22" class="text-title">Earnings Calls</text>
  </g>

  <!-- Connection to Parser -->
  <path d="M 70 265 L 70 300 L 210 300" class="edge-line" />
  <path d="M 370 265 L 370 300 L 230 300" class="edge-line" />
  <path d="M 220 300 L 220 320" class="edge-line" />

  <!-- Layout-Aware Parser -->
  <g transform="translate(120, 320)">
    <rect width="200" height="50" class="node" />
    <text x="100" y="20" class="text-title">Layout-Aware Parser</text>
    <text x="100" y="35" class="text-subtitle">LlamaParse / pdfplumber fallback</text>
  </g>
  <path d="M 220 370 L 220 400" class="edge-line" />

  <!-- Hierarchical Chunking -->
  <g transform="translate(120, 400)">
    <rect width="200" height="50" class="node" />
    <text x="100" y="20" class="text-title">Hierarchical Chunking</text>
    <text x="100" y="35" class="text-subtitle">Parent (1500) &amp; Child (400)</text>
  </g>
  
  <path d="M 120 425 L 70 425 L 70 480" class="edge-line" />
  <path d="M 320 425 L 370 425 L 370 480" class="edge-line" />

  <!-- Parent Store -->
  <g transform="translate(10, 480)">
    <rect width="120" height="50" class="node node-db" />
    <text x="60" y="25" class="text-title">Parent Store</text>
    <text x="60" y="38" class="text-subtitle">Metadata embeddings</text>
  </g>
  
  <!-- Child Vector DB -->
  <g transform="translate(310, 480)">
    <rect width="120" height="50" class="node node-db" />
    <text x="60" y="25" class="text-title">Child Vector DB</text>
    <text x="60" y="38" class="text-subtitle">Chroma search index</text>
  </g>

  <!-- RETRIEVAL & GENERATION PIPELINE (RIGHT COLUMN) -->
  
  <!-- User Query -->
  <g transform="translate(580, 60)">
    <rect width="200" height="40" class="node" />
    <text x="100" y="20" class="text-title">User Query</text>
  </g>
  <path d="M 680 100 L 680 120" class="edge-line" />

  <!-- Query Expansion Node -->
  <g transform="translate(580, 120)">
    <rect width="200" height="45" class="node" />
    <text x="100" y="18" class="text-title">Query Expansion Node</text>
    <text x="100" y="32" class="text-subtitle">Mistral 7B synonyms</text>
  </g>
  <path d="M 680 165 L 680 185" class="edge-line" />

  <!-- Expanded Query -->
  <g transform="translate(580, 185)">
    <rect width="200" height="40" class="node" fill="rgba(99, 102, 241, 0.1)" />
    <text x="100" y="20" class="text-title">Expanded Query</text>
  </g>
  <path d="M 680 225 L 680 245" class="edge-line" />

  <!-- Multi-Namespace Search -->
  <g transform="translate(580, 245)">
    <rect width="200" height="45" class="node" />
    <text x="100" y="18" class="text-title">Multi-Namespace Search</text>
    <text x="100" y="32" class="text-subtitle">Namespace routing filter</text>
  </g>
  
  <path d="M 580 268 L 530 268 L 530 310" class="edge-line" />
  <path d="M 780 268 L 830 268 L 830 310" class="edge-line" />

  <!-- Dense Search -->
  <g transform="translate(470, 310)">
    <rect width="120" height="45" class="node" />
    <text x="60" y="22" class="text-title">Dense Search</text>
    <text x="60" y="34" class="text-subtitle">Chroma ChromaDB</text>
  </g>
  
  <!-- Sparse BM25 Search -->
  <g transform="translate(770, 310)">
    <rect width="120" height="45" class="node" />
    <text x="60" y="22" class="text-title">Sparse BM25</text>
    <text x="60" y="34" class="text-subtitle">Okapi keyword search</text>
  </g>

  <path d="M 530 355 L 530 380 L 670 380" class="edge-line" />
  <path d="M 830 355 L 830 380 L 690 380" class="edge-line" />
  <path d="M 680 380 L 680 400" class="edge-line" />

  <!-- Convex Fusion Node -->
  <g transform="translate(580, 400)">
    <rect width="200" height="45" class="node" />
    <text x="100" y="18" class="text-title">Convex Score Fusion</text>
    <text x="100" y="32" class="text-subtitle">Alpha-tuned (α) combination</text>
  </g>
  <path d="M 680 445 L 680 465" class="edge-line" />

  <!-- Cross-Encoder Reranker -->
  <g transform="translate(580, 465)">
    <rect width="200" height="45" class="node" />
    <text x="100" y="18" class="text-title">Cross-Encoder Reranker</text>
    <text x="100" y="32" class="text-subtitle">MS-Marco MiniLM (top 3)</text>
  </g>
  <path d="M 680 510 L 680 530" class="edge-line" />

  <!-- Parent Context Retrieval -->
  <g transform="translate(580, 530)">
    <rect width="200" height="45" class="node" />
    <text x="100" y="18" class="text-title">Parent Context Swap</text>
    <text x="100" y="32" class="text-subtitle">Swap child chunk for parent</text>
  </g>
  <path d="M 680 575 L 680 595" class="edge-line" />

  <!-- LLM Generator -->
  <g transform="translate(580, 595)">
    <rect width="200" height="45" class="node" fill="rgba(16, 185, 129, 0.1)" stroke="#10B981" />
    <text x="100" y="18" class="text-title" fill="#34D399">LLM Generator</text>
    <text x="100" y="32" class="text-subtitle">Mistral response synthesis</text>
  </g>

</svg>
